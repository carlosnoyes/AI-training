<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI vs Human Jeopardy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Sans:wght@400;500;700&family=DM+Mono&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --board-bg: #060ce9;
      --cell-bg: #1a1acd;
      --cell-hover: #2424e8;
      --gold: #d4a843;
      --paper: #f8f6f1;
      --ink: #1a1a1a;
      --accent: #c44536;
      --correct: #2ecc40;
      --wrong: #ff4136;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #0a0a2e 0%, #1a1a4e 50%, #0a0a2e 100%);
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      padding: 1.5rem 1rem 1rem;
    }
    .header h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 2.8rem;
      color: var(--gold);
      text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
      letter-spacing: 2px;
    }
    .header p {
      color: rgba(255,255,255,0.6);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    /* ── Setup Screen ── */
    .setup-screen {
      max-width: 520px;
      margin: 2rem auto;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 2.5rem;
      backdrop-filter: blur(12px);
    }
    .setup-screen h2 {
      font-family: 'Instrument Serif', serif;
      font-size: 1.8rem;
      color: var(--gold);
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .team-input-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .team-input-row input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 1rem;
      font-family: 'DM Sans', sans-serif;
    }
    .team-input-row input::placeholder { color: rgba(255,255,255,0.35); }
    .team-input-row input:focus { outline: none; border-color: var(--gold); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.7rem 1.4rem;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-gold {
      background: linear-gradient(135deg, var(--gold), #b8912e);
      color: #1a1a1a;
    }
    .btn-gold:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(212,168,67,0.4); }
    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.25);
      color: white;
    }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
    .btn-correct { background: var(--correct); color: white; }
    .btn-wrong { background: var(--wrong); color: white; }
    .btn-sm { padding: 0.5rem 1rem; font-size: 0.85rem; }

    .team-list {
      list-style: none;
      margin: 1rem 0 1.5rem;
    }
    .team-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1rem;
      margin-bottom: 0.5rem;
      background: rgba(255,255,255,0.06);
      border-radius: 8px;
      border-left: 4px solid var(--gold);
    }
    .team-list li button {
      background: none;
      border: none;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      font-size: 1.1rem;
    }
    .team-list li button:hover { color: var(--wrong); }

    .setup-actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
    }

    /* ── Game Board ── */
    .game-container { display: none; padding: 0 1rem 2rem; }
    .game-container.active { display: block; }

    /* Scoreboard */
    .scoreboard {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 1rem auto 1.5rem;
      max-width: 1200px;
    }
    .score-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 0.75rem 1.5rem;
      min-width: 150px;
      text-align: center;
      transition: all 0.3s;
      cursor: pointer;
    }
    .score-card.active-team {
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(212,168,67,0.25);
    }
    .score-card .team-name {
      font-weight: 700;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.25rem;
    }
    .score-card .team-score {
      font-family: 'DM Mono', monospace;
      font-size: 1.8rem;
      color: var(--gold);
    }
    .score-card .team-score.negative { color: var(--wrong); }

    /* Board Grid */
    .board {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      max-width: 1200px;
      margin: 0 auto;
      background: #000;
      border-radius: 12px;
      padding: 6px;
      box-shadow: var(--shadow);
    }

    .category-header {
      background: var(--board-bg);
      padding: 1rem 0.5rem;
      text-align: center;
      font-family: 'Instrument Serif', serif;
      font-size: 0.95rem;
      color: white;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80px;
      border-radius: 4px;
    }

    .cell {
      background: var(--cell-bg);
      padding: 1.5rem 0.5rem;
      text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--gold);
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
    }
    .cell:hover { background: var(--cell-hover); transform: scale(1.03); }
    .cell.used {
      background: rgba(26,26,205,0.15);
      color: rgba(255,255,255,0.08);
      cursor: default;
      pointer-events: none;
    }

    /* ── Question Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: linear-gradient(160deg, #1a1a4e, #0d0d3a);
      border: 2px solid var(--gold);
      border-radius: 20px;
      padding: 3rem;
      max-width: 700px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 60px rgba(212,168,67,0.2);
      animation: modalIn 0.3s ease;
    }
    @keyframes modalIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-category {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 0.5rem;
    }
    .modal-value {
      font-family: 'DM Mono', monospace;
      font-size: 2rem;
      color: var(--gold);
      margin-bottom: 1.5rem;
    }
    .modal-question {
      font-family: 'Instrument Serif', serif;
      font-size: 1.6rem;
      line-height: 1.5;
      margin-bottom: 2rem;
      color: white;
    }
    .modal-answer {
      display: none;
      font-size: 1.2rem;
      color: var(--gold);
      margin-bottom: 1.5rem;
      padding: 1rem;
      background: rgba(212,168,67,0.1);
      border-radius: 12px;
      border: 1px solid rgba(212,168,67,0.2);
    }
    .modal-answer.revealed { display: block; }
    .modal-answer .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 0.5rem;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 1rem;
    }

    .modal-team-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .modal-team-btn {
      padding: 0.5rem 1.2rem;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      background: transparent;
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .modal-team-btn:hover { border-color: var(--gold); }
    .modal-team-btn.selected {
      border-color: var(--gold);
      background: rgba(212,168,67,0.2);
      color: var(--gold);
    }

    .ai-insight {
      margin-top: 1.5rem;
      padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.5);
      font-style: italic;
    }

    /* ── Final Scores ── */
    .final-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .final-overlay.active { display: flex; }

    .final-modal {
      text-align: center;
      max-width: 600px;
      width: 100%;
    }
    .final-modal h2 {
      font-family: 'Instrument Serif', serif;
      font-size: 3rem;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }
    .final-modal .trophy { font-size: 5rem; margin-bottom: 1rem; }
    .final-standings {
      list-style: none;
      margin: 2rem 0;
    }
    .final-standings li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      margin-bottom: 0.75rem;
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      font-size: 1.2rem;
    }
    .final-standings li:first-child {
      border: 2px solid var(--gold);
      background: rgba(212,168,67,0.1);
      font-size: 1.4rem;
    }
    .final-standings .rank { margin-right: 1rem; }
    .final-standings .f-score {
      font-family: 'DM Mono', monospace;
      color: var(--gold);
      font-size: 1.4rem;
    }

    /* Confetti canvas */
    #confetti { position: fixed; inset: 0; z-index: 2001; pointer-events: none; }

    /* ── Controls bar ── */
    .controls-bar {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin: 1rem auto;
      max-width: 1200px;
      flex-wrap: wrap;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .header h1 { font-size: 1.8rem; }
      .board { grid-template-columns: repeat(6, 1fr); gap: 3px; padding: 3px; }
      .category-header { font-size: 0.7rem; padding: 0.5rem 0.25rem; min-height: 60px; }
      .cell { font-size: 1rem; padding: 1rem 0.25rem; min-height: 60px; }
      .modal { padding: 2rem 1.5rem; }
      .modal-question { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <!-- ── Setup Screen ── -->
  <div class="header">
    <h1>AI vs Human Jeopardy</h1>
    <p>Test your knowledge against AI capabilities</p>
  </div>

  <div class="setup-screen" id="setupScreen">
    <h2>Game Setup</h2>
    <p style="color:rgba(255,255,255,0.6); margin-bottom:1.5rem; text-align:center;">Add at least 2 teams to begin</p>
    <div class="team-input-row">
      <input type="text" id="teamNameInput" placeholder="Enter team name..." maxlength="20">
      <button class="btn btn-gold btn-sm" id="addTeamBtn">Add Team</button>
    </div>
    <ul class="team-list" id="teamList"></ul>
    <div class="setup-actions">
      <button class="btn btn-gold" id="startGameBtn" disabled>Start Game</button>
    </div>
  </div>

  <!-- ── Game Board ── -->
  <div class="game-container" id="gameContainer">
    <div class="scoreboard" id="scoreboard"></div>
    <div class="board" id="board"></div>
    <div class="controls-bar">
      <button class="btn btn-outline btn-sm" id="endGameBtn">End Game</button>
      <button class="btn btn-outline btn-sm" id="resetGameBtn">New Game</button>
    </div>
  </div>

  <!-- ── Question Modal ── -->
  <div class="modal-overlay" id="questionModal">
    <div class="modal">
      <div class="modal-category" id="modalCategory"></div>
      <div class="modal-value" id="modalValue"></div>
      <div class="modal-question" id="modalQuestion"></div>
      <div class="modal-answer" id="modalAnswer">
        <div class="label">Answer</div>
        <div id="modalAnswerText"></div>
      </div>
      <div id="buzzPhase">
        <p style="color:rgba(255,255,255,0.5); margin-bottom:0.75rem; font-size:0.85rem;">Who buzzed in?</p>
        <div class="modal-team-buttons" id="modalTeamBtns"></div>
      </div>
      <div id="scorePhase" style="display:none;">
        <p style="margin-bottom:0.75rem; font-size:0.9rem;">Scoring for: <strong id="buzzedTeamName"></strong></p>
        <div class="modal-actions">
          <button class="btn btn-correct" id="correctBtn">Correct</button>
          <button class="btn btn-wrong" id="wrongBtn">Wrong</button>
          <button class="btn btn-outline btn-sm" id="revealBtn">Reveal Answer</button>
        </div>
      </div>
      <div id="postScorePhase" style="display:none;">
        <div class="modal-actions">
          <button class="btn btn-outline btn-sm" id="anotherTeamBtn">Another Team Tries</button>
          <button class="btn btn-gold btn-sm" id="closeModalBtn">Back to Board</button>
        </div>
      </div>
      <div class="ai-insight" id="aiInsight"></div>
    </div>
  </div>

  <!-- ── Final Scores Overlay ── -->
  <div class="final-overlay" id="finalOverlay">
    <div class="final-modal">
      <div class="trophy">🏆</div>
      <h2 id="winnerAnnounce">Game Over!</h2>
      <ul class="final-standings" id="finalStandings"></ul>
      <button class="btn btn-gold" id="playAgainBtn" style="margin-top:1rem;">Play Again</button>
    </div>
  </div>
  <canvas id="confetti"></canvas>

<script>
// ── Question Data ──
const CATEGORIES = [
  {
    name: "General Knowledge",
    emoji: "🟦",
    insight: "AI excels: instant recall across domains without fatigue.",
    questions: [
      { value: 200, q: "This African river is the longest in the world.", a: "What is the Nile?" },
      { value: 400, q: "This element has the highest melting point of all metals.", a: "What is tungsten?" },
      { value: 600, q: "This philosopher wrote Critique of Pure Reason.", a: "Who is Immanuel Kant?" },
      { value: 800, q: "This programming language was created by Guido van Rossum in 1991.", a: "What is Python?" },
      { value: 1000, q: "This country has the most UNESCO World Heritage Sites as of 2024.", a: "What is Italy?" },
    ]
  },
  {
    name: "Logic Puzzles",
    emoji: "🟩",
    insight: "AI excels: tracks multiple constraints simultaneously.",
    questions: [
      { value: 200, q: "A bat and ball cost $1.10 total. The bat costs $1 more than the ball. Cost of the ball?", a: "What is $0.05?" },
      { value: 400, q: "A clinic has 100 patients. 70 take vitamin D, 45 take magnesium, and 20 take neither. How many take both?", a: "What is 35?" },
      { value: 600, q: "You have 3 switches and 1 bulb in another room. You can enter once. How do you determine which switch controls the bulb?", a: "Turn one on, one off, wait, check heat + light." },
      { value: 800, q: "Five machines make five widgets in five minutes. At the same rate, how long would 100 machines take to make 100 widgets?", a: "What is 5 minutes?" },
      { value: 1000, q: "A box contains cards numbered 1–100. Remove every card divisible by 2, 3, or 5. How many remain?", a: "What is 26?" },
    ]
  },
  {
    name: "What's That?",
    emoji: "🟥",
    insight: "AI excels: pattern recognition across visual data.",
    questions: [
      { value: 200, q: "Describe the shape that has 3 sides.", a: "What is a triangle?" },
      { value: 400, q: "This optical illusion shows two faces or a vase depending on perspective.", a: "What is Rubin's vase?" },
      { value: 600, q: "This animal is the only mammal capable of true sustained flight.", a: "What is a bat?" },
      { value: 800, q: "This famous painting shows a woman with an enigmatic smile.", a: "What is the Mona Lisa?" },
      { value: 1000, q: "This constellation contains Polaris, the North Star.", a: "What is Ursa Minor (Little Dipper)?" },
    ]
  },
  {
    name: "Math & Quant",
    emoji: "🟨",
    insight: "AI excels: no arithmetic fatigue or error accumulation.",
    questions: [
      { value: 200, q: "A regular pentagonal pyramid has base side length 6 and height 10. What is its volume, to the nearest tenth?", a: "What is about 206.4 cubic units?" },
      { value: 400, q: "A 30-year mortgage for $300,000 at 6% annual interest, compounded monthly. Monthly payment to the nearest dollar?", a: "What is about $1,799?" },
      { value: 600, q: "Evaluate the definite integral of x² + 3x from 0 to 2.", a: "What is 26/3?" },
      { value: 800, q: "After the flop in Texas Hold'em (2 reveals remaining), you have 4 hearts. Odds of completing the flush?", a: "What is 0.3497 or 378/1081?" },
      { value: 1000, q: "In a sample of 100, 55 support a policy. How strong is the evidence that >50% of the population supports it?", a: "P-value ≈ 0.1587" },
    ]
  },
  {
    name: "Synthesis",
    emoji: "🟪",
    insight: "AI excels: condensing massive knowledge instantly.",
    questions: [
      { value: 200, q: "Summarize what it means to defragment a computer in one sentence.", a: "Reorganizing scattered data on a disk so files are stored contiguously for faster access." },
      { value: 400, q: "Explain why the sky appears blue in one sentence.", a: "Shorter blue wavelengths scatter more in Earth's atmosphere, making the sky appear blue." },
      { value: 600, q: "Summarize the difference between Roth and Traditional IRAs in one sentence.", a: "Traditional IRAs tax withdrawals later; Roth IRAs tax contributions upfront for tax-free withdrawals in retirement." },
      { value: 800, q: "Summarize the internet in one sentence.", a: "A global network connecting computers to share information instantly." },
      { value: 1000, q: "Summarize climate change causes in one sentence.", a: "Human greenhouse gas emissions trap heat and alter global climate systems." },
    ]
  },
  {
    name: "Creative Transform",
    emoji: "🟧",
    insight: "AI excels: rapid style transfer + creativity on demand.",
    questions: [
      { value: 200, q: 'Rewrite "I\'m tired" in Shakespearean style.', a: "I am weary beyond measure." },
      { value: 400, q: 'Turn "The meeting was long" into a haiku.', a: "Endless voices drone / Time stretches without mercy / Clock hands crawl slowly" },
      { value: 600, q: "Explain gravity like you're talking to a 5-year-old.", a: "Things fall down because Earth pulls them like a big magnet." },
      { value: 800, q: "Rewrite a formal email as a casual text message.", a: "Hey! Just wanted to check in about this 🙂" },
      { value: 1000, q: 'Turn a boring sentence into a movie trailer line: "The project failed."', a: "In a world where everything went wrong… one failure changed everything." },
    ]
  }
];

// ── Game State ──
let teams = [];
let usedCells = new Set();
let currentQ = null;
let buzzedTeamIndex = null;
let triedTeams = new Set();

// ── DOM refs ──
const $ = id => document.getElementById(id);
const setupScreen = $('setupScreen');
const gameContainer = $('gameContainer');
const teamNameInput = $('teamNameInput');
const teamList = $('teamList');
const startGameBtn = $('startGameBtn');
const board = $('board');
const scoreboard = $('scoreboard');
const questionModal = $('questionModal');
const finalOverlay = $('finalOverlay');

// ── Setup ──
$('addTeamBtn').addEventListener('click', addTeam);
teamNameInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTeam(); });
startGameBtn.addEventListener('click', startGame);
$('endGameBtn').addEventListener('click', showFinalScores);
$('resetGameBtn').addEventListener('click', resetGame);
$('playAgainBtn').addEventListener('click', resetGame);

function addTeam() {
  const name = teamNameInput.value.trim();
  if (!name || teams.length >= 6) return;
  if (teams.some(t => t.name.toLowerCase() === name.toLowerCase())) return;
  teams.push({ name, score: 0 });
  teamNameInput.value = '';
  teamNameInput.focus();
  renderTeamList();
}

function removeTeam(i) {
  teams.splice(i, 1);
  renderTeamList();
}

function renderTeamList() {
  teamList.innerHTML = teams.map((t, i) =>
    `<li><span>${t.name}</span><button onclick="removeTeam(${i})">✕</button></li>`
  ).join('');
  startGameBtn.disabled = teams.length < 2;
}

// ── Start Game ──
function startGame() {
  setupScreen.style.display = 'none';
  gameContainer.classList.add('active');
  usedCells.clear();
  renderScoreboard();
  renderBoard();
}

function renderScoreboard() {
  scoreboard.innerHTML = teams.map((t, i) =>
    `<div class="score-card${i === 0 ? ' active-team' : ''}" data-team="${i}">
      <div class="team-name">${t.name}</div>
      <div class="team-score${t.score < 0 ? ' negative' : ''}">${t.score < 0 ? '-' : ''}$${Math.abs(t.score).toLocaleString()}</div>
    </div>`
  ).join('');
}

function renderBoard() {
  board.innerHTML = '';
  // Headers
  CATEGORIES.forEach(cat => {
    const hdr = document.createElement('div');
    hdr.className = 'category-header';
    hdr.textContent = cat.name;
    board.appendChild(hdr);
  });
  // Cells
  for (let row = 0; row < 5; row++) {
    CATEGORIES.forEach((cat, col) => {
      const cell = document.createElement('div');
      const key = `${col}-${row}`;
      cell.className = 'cell' + (usedCells.has(key) ? ' used' : '');
      cell.textContent = usedCells.has(key) ? '' : `$${cat.questions[row].value}`;
      cell.addEventListener('click', () => openQuestion(col, row));
      board.appendChild(cell);
    });
  }
}

// ── Question Modal ──
function openQuestion(col, row) {
  const key = `${col}-${row}`;
  if (usedCells.has(key)) return;

  const cat = CATEGORIES[col];
  const q = cat.questions[row];
  currentQ = { col, row, value: q.value, key };
  buzzedTeamIndex = null;
  triedTeams.clear();

  $('modalCategory').textContent = `${cat.emoji} ${cat.name}`;
  $('modalValue').textContent = `$${q.value}`;
  $('modalQuestion').textContent = q.q;
  $('modalAnswerText').textContent = q.a;
  $('modalAnswer').classList.remove('revealed');
  $('aiInsight').textContent = `💡 ${cat.insight}`;

  showBuzzPhase();
  questionModal.classList.add('active');
}

function showBuzzPhase() {
  $('buzzPhase').style.display = 'block';
  $('scorePhase').style.display = 'none';
  $('postScorePhase').style.display = 'none';
  renderTeamBuzzButtons();
}

function renderTeamBuzzButtons() {
  $('modalTeamBtns').innerHTML = teams.map((t, i) => {
    const disabled = triedTeams.has(i) ? ' disabled style="opacity:0.3;pointer-events:none;"' : '';
    return `<button class="modal-team-btn" onclick="buzzIn(${i})"${disabled}>${t.name}</button>`;
  }).join('') +
  `<button class="modal-team-btn" onclick="noOneBuzzed()" style="border-color:rgba(255,255,255,0.1);color:rgba(255,255,255,0.4);">No one</button>`;
}

function buzzIn(teamIdx) {
  buzzedTeamIndex = teamIdx;
  $('buzzPhase').style.display = 'none';
  $('scorePhase').style.display = 'block';
  $('buzzedTeamName').textContent = teams[teamIdx].name;
}

function noOneBuzzed() {
  $('modalAnswer').classList.add('revealed');
  usedCells.add(currentQ.key);
  $('buzzPhase').style.display = 'none';
  $('scorePhase').style.display = 'none';
  $('postScorePhase').style.display = 'block';
  $('anotherTeamBtn').style.display = 'none';
  renderBoard();
}

$('correctBtn').addEventListener('click', () => {
  teams[buzzedTeamIndex].score += currentQ.value;
  usedCells.add(currentQ.key);
  $('modalAnswer').classList.add('revealed');
  flashScore(buzzedTeamIndex, 'correct');
  renderScoreboard();
  renderBoard();
  $('scorePhase').style.display = 'none';
  $('postScorePhase').style.display = 'block';
  $('anotherTeamBtn').style.display = 'none';
  checkGameEnd();
});

$('wrongBtn').addEventListener('click', () => {
  teams[buzzedTeamIndex].score -= currentQ.value;
  triedTeams.add(buzzedTeamIndex);
  flashScore(buzzedTeamIndex, 'wrong');
  renderScoreboard();
  $('scorePhase').style.display = 'none';
  $('postScorePhase').style.display = 'block';
  $('anotherTeamBtn').style.display = triedTeams.size < teams.length ? 'inline-flex' : 'none';
});

$('revealBtn').addEventListener('click', () => {
  $('modalAnswer').classList.add('revealed');
});

$('anotherTeamBtn').addEventListener('click', () => {
  showBuzzPhase();
});

$('closeModalBtn').addEventListener('click', () => {
  questionModal.classList.remove('active');
  if (!usedCells.has(currentQ.key)) {
    usedCells.add(currentQ.key);
    renderBoard();
  }
  checkGameEnd();
});

function flashScore(teamIdx, type) {
  const cards = document.querySelectorAll('.score-card');
  const card = cards[teamIdx];
  card.style.background = type === 'correct' ? 'rgba(46,204,64,0.2)' : 'rgba(255,65,54,0.2)';
  setTimeout(() => { card.style.background = ''; }, 800);
}

function checkGameEnd() {
  if (usedCells.size === 30) {
    setTimeout(showFinalScores, 500);
  }
}

// ── Final Scores ──
function showFinalScores() {
  questionModal.classList.remove('active');
  const sorted = [...teams].sort((a, b) => b.score - a.score);
  $('winnerAnnounce').textContent = `${sorted[0].name} Wins!`;
  $('finalStandings').innerHTML = sorted.map((t, i) => {
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i + 1}`;
    return `<li><span><span class="rank">${medal}</span>${t.name}</span><span class="f-score">${t.score < 0 ? '-' : ''}$${Math.abs(t.score).toLocaleString()}</span></li>`;
  }).join('');
  finalOverlay.classList.add('active');
  launchConfetti();
}

function resetGame() {
  teams.forEach(t => t.score = 0);
  usedCells.clear();
  finalOverlay.classList.remove('active');
  gameContainer.classList.remove('active');
  setupScreen.style.display = 'block';
  teams = [];
  renderTeamList();
}

// ── Confetti ──
function launchConfetti() {
  const canvas = $('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const pieces = Array.from({ length: 150 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    w: Math.random() * 10 + 5,
    h: Math.random() * 6 + 3,
    color: ['#d4a843', '#c44536', '#2ecc40', '#3498db', '#e67e22', '#9b59b6'][Math.floor(Math.random() * 6)],
    vx: (Math.random() - 0.5) * 3,
    vy: Math.random() * 3 + 2,
    rot: Math.random() * 360,
    rv: (Math.random() - 0.5) * 8,
  }));

  let frame = 0;
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.rv;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    frame++;
    if (frame < 180) requestAnimationFrame(animate);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  animate();
}
</script>
</body>
